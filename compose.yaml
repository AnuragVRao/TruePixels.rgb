# Local PostgreSQL for TruePixels.rgb (Phase 2).
#
#   docker compose --env-file backend/.env up -d db     # start
#   cd backend && alembic upgrade head                   # create / update the schema
#   docker compose --env-file backend/.env down          # stop (data kept; NEVER add -v)
#
# Credentials come ONLY from backend/.env (gitignored; copy
# backend/.env.example and choose a password), passed with --env-file for
# interpolation. There are no defaults here on purpose: without them compose
# refuses to run (the ":?" below), rather than starting a database with a
# guessable password. DATABASE_URL in the same file must use the same
# user/password/database, port 5433.
#
# The container receives ONLY the three POSTGRES_* values (Phase 6-pre). It
# used to get all of backend/.env via env_file - including JWT_SECRET_KEY,
# readable by anyone with `docker inspect`. POSTGRES_PASSWORD is only applied
# when the volume is first initialised; to change it later see
# docs/rotate-secrets.md (ALTER USER).
#
# Bound to 127.0.0.1 only: the database is not reachable from the network.
# Port 5433 on the host avoids clashing with any locally installed Postgres.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run compose with --env-file backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run compose with --env-file backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?run compose with --env-file backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - truepixels-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped


  # ---------------------------------------------------------------------
  # HTTPS reverse proxy (Phase 6). Exactly one profile at a time; see
  # docs/https.md. The API is NOT containerised (GPU): it runs on the host,
  # bound to 127.0.0.1, and Caddy reaches it via host.docker.internal.
  # Caddy's data dir holds the local CA's PRIVATE KEY: infra/caddy/data/ is
  # gitignored and must never be committed or shared.
  caddy-dev:
    image: caddy:2
    profiles: ["https-dev"]
    environment:
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?set PROXY_SHARED_SECRET in backend/.env}
      TP_UPSTREAM: ${TP_UPSTREAM:-host.docker.internal:8000}
      TP_HTTP_PORT: ${TP_HTTP_PORT:-80}
      TP_HTTPS_PORT: ${TP_HTTPS_PORT:-443}
    ports:
      - "127.0.0.1:${TP_HTTP_PORT:-80}:${TP_HTTP_PORT:-80}"
      - "127.0.0.1:${TP_HTTPS_PORT:-443}:${TP_HTTPS_PORT:-443}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/common.caddy:/etc/caddy/common.caddy:ro
      - ./frontend/dist:/srv:ro
      - ./infra/caddy/data/dev:/data
      - ./infra/caddy/config/dev:/config
    restart: unless-stopped

  caddy-prod:
    image: caddy:2
    profiles: ["https-prod"]
    environment:
      PROXY_SHARED_SECRET: ${PROXY_SHARED_SECRET:?set PROXY_SHARED_SECRET in backend/.env}
      TP_UPSTREAM: ${TP_UPSTREAM:-host.docker.internal:8000}
      TP_SITE_ADDRESS: ${TP_SITE_ADDRESS:-localhost}
      TP_TLS: ${TP_TLS:-internal}
      TP_HTTP_PORT: ${TP_HTTP_PORT:-80}
      TP_HTTPS_PORT: ${TP_HTTPS_PORT:-443}
    ports:
      # All interfaces: a real deployment must be reachable (and ACME needs 80).
      - "${TP_HTTP_PORT:-80}:${TP_HTTP_PORT:-80}"
      - "${TP_HTTPS_PORT:-443}:${TP_HTTPS_PORT:-443}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./infra/caddy/common.caddy:/etc/caddy/common.caddy:ro
      - ./frontend/dist:/srv:ro
      - ./infra/caddy/data/prod:/data
      - ./infra/caddy/config/prod:/config
    restart: unless-stopped

volumes:
  truepixels-pgdata:
